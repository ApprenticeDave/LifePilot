<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7f4">
  <title>LifePilot — a gentle place to begin</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="site-header">
    <a class="brand" href="/" aria-label="LifePilot home"><span class="brand-mark" aria-hidden="true">L</span> LifePilot</a>
    <span class="local-indicator"><span aria-hidden="true"></span> On this computer</span>
  </header>
  <main id="main" tabindex="-1">
    <div id="app" aria-live="off">
      <section class="card loading-card" aria-label="Loading LifePilot">
        <p>Opening your local workspace…</p>
      </section>
    </div>
    <p class="save-status" role="status" aria-live="polite"><span id="save-status"></span>
      <button id="retry-save" class="text-button" type="button" hidden>Retry save</button>
      <button id="reload-state" class="text-button" type="button" hidden>Reload saved data</button></p>
  </main>
  <footer class="site-footer">LifePilot is a small first step. Your choices stay under your control.</footer>
</body>
</html>
